{% extends 'base.html' %}

{% block conteudo %}
carro novo

<h2>Cadastrar Carro</h2>
<!-- Critério 6.1: Inserção associando a um proprietário -->
<form method="POST">
    <label>Proprietário:</label><br>
    <select name="proprietario_id" required>
        {% for p in proprietarios %}
        <option value="{{ p.id }}">{{ p.nome }} ({{ p.cpf_mascarado }})</option>
        {% endfor %}
    </select><br><br>
    <label>Modelo:</label><br>
    <input type="text" name="modelo" required><br><br>
    <label>Placa:</label><br>
    <input type="text" name="placa" required><br><br>
    <button type="submit">Cadastrar Carro</button>
</form>
{% endblock %}
{% endblock %}
