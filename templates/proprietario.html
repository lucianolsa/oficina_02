{% extends 'base.html' %}

{% block conteudo %}

<h2>Proprietários cadastrados</h2>

<form method="POST" action="{{ url_for('proprietario') }}" >
            <input type="text" name="busca"  placeholder="Buscar por nome..." value="{{ busca }}">
            <button type="submit">Buscar</button>
            <a href="{{url_for('proprietario')}}" >Limpar</a>
        </form>
<br>
<a href="{{ url_for('proprietario_novo') }}">
    Novo Proprietário
</a>

<table >

    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>E-mail</th>
        <th>CPF</th>
        <th>Ações</th>

    </tr>

    {% for p in proprietarios %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nome }}</td>
        <td>{{ p.telefone }}</td>
        <td>{{ p.email }}</td>
        <td>{{ p.cpf_mascarado }}</td>
        <td><a href="{{url_for('proprietario_editar',id = p.id)}}">Editar</a>
        <form action="{{ url_for('proprietario_excluir', id=p.id) }}"
      method="POST"
      onsubmit="return confirm('Tem certeza que deseja excluir este proprietário?')">

    <button type="submit" class="btn btn-danger">
        Excluir
    </button>

</form></td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
