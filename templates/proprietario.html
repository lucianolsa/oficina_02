{% extends 'base.html' %}

{% block conteudo %}

<h2>Proprietários cadastrados</h2>

<a href="{{ url_for('proprietario_novo') }}">
    Novo Proprietário
</a>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>E-mail</th>
        <th>CPF</th>
    </tr>

    {% for p in proprietarios %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nome }}</td>
        <td>{{ p.telefone }}</td>
        <td>{{ p.email }}</td>
        <td>{{ p.cpf_mascarado }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
