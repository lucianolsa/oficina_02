{% extends 'base.html' %}

{% block conteudo %}

<h2>Carros cadastrados</h2>

<form method="POST" action="{{ url_for('carro') }}" >
            <input type="text" name="busca"  placeholder="Buscar por placa..." value="{{ busca }}">
            <button type="submit">Buscar</button>
            <a href="{{url_for('carro')}}" >Limpar</a>
        </form>
<br>
<a href="{{ url_for('carro_novo') }}">
    Novo Carro
</a>

<table >

    <tr>
        <th>ID</th>
        <th>Modelo</th>
        <th>Placa</th>
        <th>Proprietário</th>

    </tr>

    {% for c in carros %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.modelo }}</td>
        <td>{{ c.placa }}</td>
        <td>{{ c.proprietario_join.nome }}</td>

    </tr>
    {% endfor %}

</table>

{% endblock %}
